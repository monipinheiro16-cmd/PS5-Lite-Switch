
name: Build PS5 Lite Switch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Nintendo Switch Homebrew
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar ferramentas
        shell: bash
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          command -v aarch64-none-elf-g++
          aarch64-none-elf-g++ --version

          find "$DEVKITPRO" -name switch.h -print

      - name: Compilar aplicativo
        shell: bash
        run: |
          make clean
          make -j2

      - name: Verificar NRO
        shell: bash
        run: |
          find . -name "*.nro" -type f
          test -f PS5-Lite-Switch.nro
          ls -lh PS5-Lite-Switch.nro

      - name: Publicar NRO
        uses: actions/upload-artifact@v4
        with:
          name: PS5-Lite-Switch
          path: PS5-Lite-Switch.nro
          if-no-files-found: error
