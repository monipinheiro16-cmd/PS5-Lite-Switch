
name: Build PS5 Lite Switch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nintendo Switch Homebrew
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar ambiente
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          test -f "$DEVKITPRO/libnx/switch_rules"
          ls -la
          ls -la source

      - name: Diagnosticar Makefile
        run: |
          make -pn | head -n 100

      - name: Compilar aplicativo
        run: |
          make -j2

      - name: Verificar NRO
        run: |
          test -f switchps5lite.nro
          ls -lh switchps5lite.nro

      - name: Publicar NRO
        uses: actions/upload-artifact@v4
        with:
          name: PS5-Lite-Switch-NRO
          path: switchps5lite.nro
          if-no-files-found: error
