name: Build PS5 Lite Switch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Nintendo Switch Homebrew
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar ferramentas
        shell: bash
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++" --version
          find "$DEVKITPRO/libnx" -name switch.h -print
          ls -l "$DEVKITPRO/tools/bin/elf2nro"

      - name: Compilar aplicativo
        shell: bash
        run: |
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean
          make -j2

      - name: Verificar NRO
        shell: bash
        run: |
          find . -name "*.nro" -type f
          test -f PS5-Lite-Switch.nro
          ls -lh PS5-Lite-Switch.nro

      - name: Publicar NRO
        uses: actions/upload-artifact@v4
        with:
          name: PS5-Lite-Switch
          path: PS5-Lite-Switch.nro
          if-no-files-found: error
