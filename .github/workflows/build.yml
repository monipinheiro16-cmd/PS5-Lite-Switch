
name: Build PS5 Lite Switch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Nintendo Switch Homebrew
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm switch-dev

      - name: Verificar ambiente
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          test -x "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++"
          test -f "$DEVKITPRO/libnx/include/switch.h"
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++" --version

      - name: Compilar aplicativo
        run: |
          make clean
          make -j2

      - name: Verificar NRO
        run: |
          test -f PS5-Lite-Switch.nro
          ls -lh PS5-Lite-Switch.nro

      - name: Publicar NRO
        uses: actions/upload-artifact@v4
        with:
          name: PS5-Lite-Switch
          path: PS5-Lite-Switch.nro
          if-no-files-found: error
